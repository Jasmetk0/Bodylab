name: Test and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and generated pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check and unit tests
        run: |
          node --check src/seed.js
          node --check src/math.js
          node --check src/app.js
          node tests/test_math.js
      - name: Regenerate browser builds
        run: python3 build.py
      - name: Verify generated files were committed
        run: git diff --exit-code -- index.html standalone.html
